services:
  - type: web
    name: ton-casino-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ton-casino-db
          property: connectionString
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false

databases:
  - name: ton-casino-db
    plan: free
    databaseName: casino
    user: casino